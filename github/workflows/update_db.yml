name: Update MySQL Database

on:
  push:
    paths:
      - '*.csv' # 當 CSV 改變時自動觸發
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas sqlalchemy pymysql

      - name: Update Database
        env:
          DB_HOST: ${{ secrets.MYSQL_HOST }}
          DB_PORT: ${{ secrets.MYSQL_PORT }}
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_NAME: ${{ secrets.MYSQL_DB }}
        run: |
          python -c "
          import pandas as pd
          from sqlalchemy import create_engine, text
          import os, glob
          
          csv_files = glob.glob('*.csv')
          target_csv = 'sales_updated_300.csv' if 'sales_updated_300.csv' in csv_files else 'sales_original_300.csv'
          
          print(f'Loading data from {target_csv}...')
          df = pd.read_csv(target_csv, encoding='utf-8-sig')
          df['net_sales'] = df['unit_price'] * (df['quantity'] - df['returned_quantity'])
          
          DB_HOST = os.environ['DB_HOST']
          DB_PORT = os.environ['DB_PORT']
          DB_USER = os.environ['DB_USER']
          DB_PASSWORD = os.environ['DB_PASSWORD']
          DB_NAME = os.environ.get('DB_NAME', 'defaultdb')
          
          engine = create_engine(f'mysql+pymysql://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}')
          
          with engine.connect() as conn:
              conn.execute(text('DROP TABLE IF EXISTS sales_data'))
              conn.execute(text('''
                  CREATE TABLE sales_data (
                      sale_id BIGINT PRIMARY KEY,
                      sale_date VARCHAR(255),
                      product_id BIGINT,
                      product_name VARCHAR(255),
                      category VARCHAR(255),
                      channel VARCHAR(255),
                      unit_price BIGINT,
                      quantity BIGINT,
                      returned_quantity BIGINT,
                      net_sales BIGINT
                  )
              '''))
          
          df.to_sql('sales_data', engine, if_exists='append', index=False)
          print('✅ 資料庫更新成功！')
          "
