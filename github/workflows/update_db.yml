name: Update MySQL Database

on:
  push:
    paths:
      - '*.csv'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas sqlalchemy pymysql

      - name: Update Database
        env:
          DB_HOST: ${{ secrets.MYSQL_HOST }}
          DB_PORT: ${{ secrets.MYSQL_PORT }}
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_NAME: ${{ secrets.MYSQL_DB }}
        run: |
          python -c "
          import pandas as pd
          from sqlalchemy import create_engine, text
          import os
          
          DB_HOST = os.environ['DB_HOST']
          DB_PORT = os.environ['DB_PORT']
          DB_USER = os.environ['DB_USER']
          DB_PASSWORD = os.environ['DB_PASSWORD']
          DB_NAME = os.environ.get('DB_NAME', 'defaultdb')
          
          engine = create_engine(f'mysql+pymysql://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}')
          
          # 定義兩份檔案與對應的資料表名稱
          files_to_upload = {
              'sales_original': 'sales_original_300.csv',
              'sales_updated': 'sales_updated_300.csv'
          }
          
          for table_name, file_name in files_to_upload.items():
              if os.path.exists(file_name):
                  print(f'Uploading {file_name} to table {table_name}...')
                  df = pd.read_csv(file_name, encoding='utf-8-sig')
                  df['net_sales'] = df['unit_price'] * (df['quantity'] - df['returned_quantity'])
                  
                  with engine.connect() as conn:
                      conn.execute(text(f'DROP TABLE IF EXISTS {table_name}'))
                      conn.execute(text(f'''
                          CREATE TABLE {table_name} (
                              sale_id BIGINT PRIMARY KEY,
                              sale_date VARCHAR(255),
                              product_id BIGINT,
                              product_name VARCHAR(255),
                              category VARCHAR(255),
                              channel VARCHAR(255),
                              unit_price BIGINT,
                              quantity BIGINT,
                              returned_quantity BIGINT,
                              net_sales BIGINT
                          )
                      '''))
                  
                  df.to_sql(table_name, engine, if_exists='append', index=False)
                  print(f'✅ {table_name} 更新成功！')
          "
